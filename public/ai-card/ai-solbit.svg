<svg xmlns="http://www.w3.org/2000/svg" width="1409" height="1116" viewBox="0 0 1409 1116">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FBFA"/>
      <stop offset="55%" stop-color="#E6F7F5"/>
      <stop offset="100%" stop-color="#FDF8EC"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B3D66"/>
      <stop offset="100%" stop-color="#123f63"/>
    </linearGradient>
    <g id="dotgrid">
      <circle r="3.2" fill="#0D9488"/>
      <circle r="3.2" fill="#0D9488" cx="26"/>
      <circle r="3.2" fill="#0D9488" cx="52"/>
      <circle r="3.2" fill="#0D9488" cx="78"/>
      <circle r="3.2" fill="#0D9488" cx="104"/>
      <circle r="3.2" fill="#0D9488" cy="26"/>
      <circle r="3.2" fill="#0D9488" cx="26" cy="26"/>
      <circle r="3.2" fill="#0D9488" cx="52" cy="26"/>
      <circle r="3.2" fill="#0D9488" cx="78" cy="26"/>
      <circle r="3.2" fill="#0D9488" cx="104" cy="26"/>
      <circle r="3.2" fill="#0D9488" cy="52"/>
      <circle r="3.2" fill="#0D9488" cx="26" cy="52"/>
      <circle r="3.2" fill="#0D9488" cx="52" cy="52"/>
      <circle r="3.2" fill="#0D9488" cx="78" cy="52"/>
      <circle r="3.2" fill="#0D9488" cx="104" cy="52"/>
      <circle r="3.2" fill="#0D9488" cy="78"/>
      <circle r="3.2" fill="#0D9488" cx="26" cy="78"/>
      <circle r="3.2" fill="#0D9488" cx="52" cy="78"/>
      <circle r="3.2" fill="#0D9488" cx="78" cy="78"/>
      <circle r="3.2" fill="#0D9488" cx="104" cy="78"/>
