  <g transform="translate(420 860) scale(1.35)" opacity="0.95">
    <path d="M44 -50 L 88 -25 L 88 25 L 44 50 L 0 25 L 0 -25 Z" fill="none" stroke="url(#teal)" stroke-width="13" stroke-linejoin="round"/>
    <path d="M22 -25 L 66 0 L 44 25 L 22 12" fill="none" stroke="url(#teal)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- ring accents -->
  <circle cx="1180" cy="130" r="46" fill="none" stroke="#0D9488" stroke-width="2.5" opacity="0.5"/>
  <circle cx="1240" cy="170" r="46" fill="none" stroke="#F4BF4F" stroke-width="2.5" opacity="0.65"/>
  <circle cx="90" cy="120" r="34" fill="none" stroke="#14B8A6" stroke-width="2.5" opacity="0.55"/>

  <!-- dot grids -->
  <use href="#dotgrid" transform="translate(96 210)" opacity="0.55"/>
  <use href="#dotgrid" transform="translate(1210 380)" opacity="0.45"/>
  <use href="#dotgrid" transform="translate(150 620)" opacity="0.4"/>
  <use href="#dotgrid" transform="translate(1180 920)" opacity="0.5"/>
</svg>
